# Conference deadlines, shown on /deadlines.
#
# The list keeps to conferences ranked A* or A by CORE. Health is the one
# exception; the note at the top of that section says why.
#
# One block per deadline. To add a conference, copy a block and edit it. The
# page sorts everything itself, counts down to each date, and moves a
# conference to "Passed" when its paper deadline is over. After that, update
# the block for next year's edition when the new call for papers comes out.
#
#   name       Short name and year, e.g. ICSE 2028. The only required field.
#   full       Full conference name.
#   tags       One or more areas, e.g. [SE, HCI]. The filter buttons on the
#              page come from these, so use the same spelling each time.
#   core       CORE conference rank: A*, A, B, C, Australasian, National, or
#              Unranked. Ranks are listed at portal.core.edu.au/conf-ranks.
#   abstract   Abstract or registration deadline, if the venue has one.
#   deadline   Full paper deadline. Leave it out while the date is unknown.
#              Write "deadline: rolling" for venues that take papers any time.
#   last_year  For conferences without a date yet: last year's deadline.
#              The page uses it to order the "not announced" list.
#   where      City and country.
#   when       Conference dates, as plain text.
#   link       Call for papers.
#   note       Anything else, e.g. "Cycle 1 of 2".
#
# Writing dates:
#   2027-03-13               means 23:59 Anywhere on Earth (AoE), the usual
#                            time for paper deadlines
#   2027-03-13 17:00 PT      any other time: add the time and the zone
#   2027-03-13 11:59 pm ET   12-hour times work too
#   2027-03-13 23:59 UTC+8   so do UTC offsets
# Zones it knows: AoE, UTC, ET, CT, MT, PT, CET, BST, UTC+N, or a full zone
# name such as Europe/Berlin. A time with no zone is read as AoE.
#
# Put text in quotes if it contains a colon followed by a space.
#
# Dates below were copied from each conference's own call for papers in
# November 2026. Calls change, so check the link before you plan around one.
# Ranks are from ICORE2026, the CORE edition current in November 2026. In
# 2020 CORE dropped the information systems conferences and Hypertext as not
# primarily computing, so those carry their CORE2018 rank and say so in their
# note.


